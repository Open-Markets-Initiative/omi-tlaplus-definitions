name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch Tla Tools
        run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Check Definitions
        run: set -u; mkdir -p /tmp/logs; export JAR="$GITHUB_WORKSPACE/tla2tools.jar"; jobs=$(nproc); room=$(( $(awk '/MemAvailable/ {print $2}' /proc/meminfo) / 1572864 )); if [ "$room" -lt "$jobs" ]; then jobs=$room; fi; if [ "$jobs" -lt 1 ]; then jobs=1; fi; echo "checking $jobs at once"; find . -name "*.tla" | sort | xargs -P "$jobs" -n 1 sh -c 'module="$1"; name=$(basename "$module" .tla); mkdir -p "/tmp/tlc/$name"; if (cd "$(dirname "$module")" && timeout 300 java -XX:+UseParallelGC -Xss64m -Xmx1g -Djava.io.tmpdir="/tmp/tlc/$name" -cp "$JAR" tlc2.TLC -metadir "/tmp/tlc/$name/states" -workers 1 "$name.tla" > "/tmp/logs/$name.log" 2>&1); then echo "  $module"; else echo "$module" > "/tmp/logs/$name.failed"; fi' check; failed=0; for mark in $(find /tmp/logs -name "*.failed" | sort); do echo "FAILED $(cat "$mark")"; tail -20 "${mark%.failed}.log"; failed=$((failed+1)); done; if [ "$failed" -gt 0 ]; then echo "$failed module(s) failed"; exit 1; fi


