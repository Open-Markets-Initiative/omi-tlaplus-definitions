name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch Tla Tools
        run: curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Check Definitions
        run: set -u; failed=0; for module in $(find . -name "*.tla" | sort); do name=$(basename "$module" .tla); if ! (cd "$(dirname "$module")" && timeout 300 java -XX:+UseParallelGC -Xss64m -cp "$GITHUB_WORKSPACE/tla2tools.jar" tlc2.TLC -metadir "/tmp/tlc/$name" -workers auto "$name.tla" > "/tmp/$name.log" 2>&1); then echo "FAILED $module"; tail -20 "/tmp/$name.log"; failed=$((failed+1)); else echo "  $module"; fi; done; if [ "$failed" -gt 0 ]; then echo "$failed module(s) failed"; exit 1; fi


